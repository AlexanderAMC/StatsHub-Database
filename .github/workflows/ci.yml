# CI de la base de datos (RNF-23): aplica, verifica y revierte las migraciones en PostgreSQL 17.
name: CI Database

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statshub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migraciones, seeds y restricciones
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/statshub_test
        run: npm test
